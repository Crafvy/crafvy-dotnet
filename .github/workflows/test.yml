name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Builds for net8.0 and netstandard2.0
        run: dotnet build src/Crafvy -c Release
      - name: Tests (the shared conformance suite)
        run: dotnet test tests/Crafvy.Tests
